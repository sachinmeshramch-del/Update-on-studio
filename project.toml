# Cloud Native Buildpacks (CNB) project descriptor for Google Cloud Buildpacks
[project]
id = "com.goldswing.app"
name = "gold-swing-ai"
version = "1.0.0"

[build]
exclude = [
  ".git",
  ".github",
  "node_modules",
  "**/node_modules",
  ".env",
  ".env.*",
  "*.log",
  ".metaapi",
  "**/.historical_data/backtest_runs"
]

# Ensure Google Cloud Buildpack uses Node 20 LTS
[[build.env]]
name = "GOOGLE_NODEJS_VERSION"
value = "20.x.x"

# Prevent npm from stripping devDependencies during the build phase
[[build.env]]
name = "NPM_CONFIG_PRODUCTION"
value = "false"

# Explicitly instruct the buildpack to run our gcp-build lifecycle script
[[build.env]]
name = "GOOGLE_NODE_RUN_SCRIPTS"
value = "gcp-build"

# Memory optimization for Google Cloud Build containers
[[build.env]]
name = "NODE_OPTIONS"
value = "--max-old-space-size=2048"
