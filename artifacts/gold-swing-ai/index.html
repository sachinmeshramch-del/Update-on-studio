<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Gold Swing AI Pro</title>
    <meta name="description" content="High-precision AI-powered Gold (XAUUSD) swing trading signals and automated execution engine with MetaApi integration." />
    <meta property="og:title" content="Gold Swing AI Pro" />
    <meta property="og:description" content="High-precision AI-powered Gold (XAUUSD) swing trading signals and automated execution engine with MetaApi integration." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:monospace;"><b>Global Error:</b> ' + e.message + '<br/><br/>' + e.filename + ':' + e.lineno + '<br/><br/>' + (e.error ? e.error.stack : '') + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-family:monospace;"><b>Unhandled Promise Rejection:</b> ' + e.reason + '</div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
