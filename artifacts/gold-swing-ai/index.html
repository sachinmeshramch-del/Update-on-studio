<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Gold Swing AI Pro</title>
    <meta name="description" content="High-precision AI-powered Gold (XAUUSD) swing trading signals and automated execution engine with MetaApi integration." />
    <meta property="og:title" content="Gold Swing AI Pro" />
    <meta property="og:description" content="High-precision AI-powered Gold (XAUUSD) swing trading signals and automated execution engine with MetaApi integration." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        // Automatic recovery when new deployment is pushed and browser requests a stale bundle chunk
        window.addEventListener('vite:preloadError', function(event) {
          console.warn('[Vite] Preload chunk error detected after deployment update. Reloading with fresh assets...', event);
          window.location.reload();
        });

        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message.toLowerCase() : '';
          if (msg.indexOf('failed to fetch dynamically imported module') !== -1 ||
              msg.indexOf('importing a module script failed') !== -1 ||
              msg.indexOf('loading chunk') !== -1) {
            var reloadKey = 'gold_swing_chunk_reload_' + (window.location.pathname || '');
            if (!sessionStorage.getItem(reloadKey)) {
              sessionStorage.setItem(reloadKey, '1');
              window.location.reload();
              return;
            }
          }
          var root = document.getElementById('root');
          if (root && !root.dataset.rendered) {
            root.innerHTML = '<div style="background:#09090b;color:#f87171;min-height:100vh;padding:24px;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">' +
              '<div style="max-width:480px;width:100%;background:#18181b;padding:28px;border-radius:12px;border:1px solid #27272a;box-shadow:0 8px 30px rgba(0,0,0,0.5);">' +
              '<div style="width:40px;height:40px;border-radius:50%;background:rgba(239,68,68,0.15);color:#ef4444;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:20px;">!</div>' +
              '<h3 style="color:#f4f4f5;margin:0 0 8px 0;font-size:18px;">Application Update Detected</h3>' +
              '<p style="color:#a1a1aa;font-size:13px;line-height:1.5;margin:0 0 20px 0;">A new version of Gold Swing AI Pro has been deployed or cache needs to be refreshed.</p>' +
              '<button onclick="sessionStorage.clear();window.location.reload(true)" style="background:#eab308;color:#09090b;font-weight:600;font-size:14px;padding:12px 24px;border-radius:8px;border:none;cursor:pointer;width:100%;transition:opacity 0.2s;">Refresh Application</button>' +
              '</div></div>';
          }
        });

        window.addEventListener('unhandledrejection', function(e) {
          console.warn('[Unhandled Rejection]', e.reason);
        });
      })();
    </script>
  </head>
  <body style="background:#09090b;margin:0;">
    <div id="root">
      <div style="min-height:100vh;background:#09090b;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;">
        <div style="text-align:center;">
          <div style="display:inline-block;width:36px;height:36px;border:3px solid rgba(234,179,8,0.2);border-top-color:#eab308;border-radius:50%;animation:goldsyncspin 1s linear infinite;"></div>
          <div style="margin-top:16px;font-size:14px;color:#a1a1aa;font-weight:500;letter-spacing:0.02em;">Loading Gold Swing AI Pro...</div>
        </div>
      </div>
      <style>@keyframes goldsyncspin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
