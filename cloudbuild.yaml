steps:
  # 1. Build optimized container using the repository Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aladdin:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aladdin:latest'
      - '.'

  # 2. Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/aladdin:$COMMIT_SHA'

  # 3. Deploy container image to Google Cloud Run service 'aladdin'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aladdin'
      - '--image'
      - 'gcr.io/$PROJECT_ID/aladdin:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/aladdin:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/aladdin:latest'

options:
  logging: CLOUD_LOGGING_ONLY
